<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hover Icons — goldens</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: #d8d8dc;
        color: #222;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.5rem;
        font-weight: 650;
        text-align: center;
      }
      p.sub {
        margin: 0 0 1.75rem;
        text-align: center;
        color: #555;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.25rem;
      }
      figure {
        margin: 0;
        background: #ece8e4;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        object-fit: contain;
        background: #ece8e4;
      }
      figcaption {
        padding: 0.7rem 0.85rem 0.9rem;
        font-size: 0.95rem;
        text-align: center;
      }
      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hover Icons</h1>
      <p class="sub">Goldens · camera, messages, phone, email × tame and neon</p>
      <div class="grid">
        <figure>
          <img src="camera_tame.png?v=hover24" alt="camera tame" width="1024" height="1024" />
          <figcaption>camera · tame</figcaption>
        </figure>
        <figure>
          <img src="camera_neon.png?v=hover24" alt="camera neon" width="1024" height="1024" />
          <figcaption>camera · neon</figcaption>
        </figure>
        <figure>
          <img src="messages_tame.png?v=hover24" alt="messages tame" width="1024" height="1024" />
          <figcaption>messages · tame</figcaption>
        </figure>
        <figure>
          <img src="messages_neon.png?v=hover24" alt="messages neon" width="1024" height="1024" />
          <figcaption>messages · neon</figcaption>
        </figure>
        <figure>
          <img src="phone_tame.png?v=hover24" alt="phone tame" width="1024" height="1024" />
          <figcaption>phone · tame</figcaption>
        </figure>
        <figure>
          <img src="phone_neon.png?v=hover24" alt="phone neon" width="1024" height="1024" />
          <figcaption>phone · neon</figcaption>
        </figure>
        <figure>
          <img src="email_tame.png?v=hover24" alt="email tame" width="1024" height="1024" />
          <figcaption>email · tame</figcaption>
        </figure>
        <figure>
          <img src="email_neon.png?v=hover24" alt="email neon" width="1024" height="1024" />
          <figcaption>email · neon</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
